name: promo screenshots
on:
  push:
    paths: [".github/promo/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: mkdir -p out && cd .github/promo && cd ../.. && python .github/promo/shots.py
      - run: |
          cd out
          git init -q -b promo && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add . && git commit -qm shots
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" promo
